services:
  mongodb:
    image: mongo:7
    container_name: german-app-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: german-app

  # Optional: uncomment to get a Mongo GUI at http://localhost:8081
  # mongo-express:
  #   image: mongo-express
  #   ports:
  #     - "8081:8081"
  #   environment:
  #     ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
  #   depends_on:
  #     - mongodb

volumes:
  mongo-data:
